<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>สมัครสมาชิก | ChatGun</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./signup.css">
  <script defer src="./signup.js"></script>
</head>
<body>
  <header><a href="./" class="brand"><img src="./logo.svg" width="40" alt=""><span>Chat<span class="gradient">Gun</span></span></a><a href="./">← กลับหน้าแรก</a></header>
  <main>
    <aside><span class="eyebrow">WELCOME TO CHATGUN ✦</span><h1>มาเป็นส่วนหนึ่ง<br><span class="gradient">ของเรื่องราวดี ๆ</span></h1><p>แชทกัน แชร์กัน เจอกัน — พบเพื่อนใหม่และคอมมูนิตี้ที่ใช่</p></aside>
    <section class="card">
      <h2>สร้างบัญชีใหม่</h2><p>เลือกวิธีสมัครสมาชิกที่สะดวกสำหรับคุณ</p>
      <div class="providers"><button type="button" data-provider="line" class="line">LINE</button><button type="button" data-provider="facebook" class="facebook">Facebook</button><button type="button" data-provider="google" class="google">Google</button></div>
      <div class="separator">หรือสมัครด้วย OTP</div>
      <div class="tabs"><button id="phone-tab" disabled type="button" aria-disabled="true">เบอร์มือถือ (เร็ว ๆ นี้)</button><button id="email-tab" class="active" type="button">อีเมล</button></div>
      <form id="start"><label for="contact" id="contact-label">อีเมล</label><input id="contact" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required><button class="primary" type="submit"><span>ส่งรหัส OTP →</span></button></form>
      <form id="verify" hidden><p>ส่งรหัสไปที่ <strong id="destination"></strong></p><label for="code">รหัส OTP 6 หลัก</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"><button class="primary" type="submit"><span>ยืนยันและสมัครสมาชิก →</span></button><button id="resend" type="button" class="link">ส่งรหัสใหม่</button><button id="change" type="button" class="link">เปลี่ยนอีเมล</button></form>
      <div id="turnstile" class="turnstile" aria-label="การตรวจสอบความปลอดภัย"></div>
      <p id="message" role="status" aria-live="polite"></p>
      <small>การสมัครสมาชิกถือว่ายอมรับข้อกำหนดและนโยบายความเป็นส่วนตัวของ ChatGun</small>
    </section>
  </main>
</body>
</html>
