name: Phase 8 WebKit isolated regression (no deployment)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgun-webkit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  webkit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - run: npm run build
        env:
          CHATGUN_RELEASE_MODE: controlled-beta
      - run: npx playwright test --config=playwright.phase8-webkit.config.js
      # No secrets, real OAuth, Cloudflare credentials, remote mutations or deployment.
