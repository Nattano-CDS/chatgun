name: CodeQL security analysis
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * 1'
permissions:
  contents: read
  security-events: write
concurrency:
  group: chatgun-codeql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
