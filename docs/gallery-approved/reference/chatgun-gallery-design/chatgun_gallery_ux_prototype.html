const palettes=[['#eedbb9','#aa9ca8','#655879','#2f465f'],['#bedcd7','#8caca8','#697e82','#384956'],['#f3cdb8','#d69a90','#a26f8b','#5c5279'],['#debad0','#8f86b1','#6476a2','#374b68'],['#e8d1ac','#a3ad87','#667d75','#3d555a'],['#b0cede','#9ab5ba','#76759e','#4b516d'],['#e3c9ca','#c5a0b0','#88829e','#504d6d'],['#d4d8e8','#98adc9','#757aa7','#40486e'],['#bbd4e5','#8eacc6','#708da7','#475b7c'],['#d3b7c5','#ad9cbe','#736d9c','#4b4a74'],['#d8d1cb','#b69a9c','#8d7e8f','#545668'],['#c5d3c8','#adb9a7','#859b99','#5e7580'],['#e5c9b5','#c09e9b','#a37e8b','#746176'],['#bdcbdc','#9facbb','#798c9d','#4b6578'],['#d6c7de','#a7a5ce','#7d80ab','#525879']];
function scene(i){let c=palettes[i%palettes.length],sun=(i*17)%140+70;return `<svg aria-hidden="true" viewBox="0 0 320 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="s${i}" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="m${i}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${c[2]}"/><stop offset="1" stop-color="${c[3]}"/></linearGradient></defs><rect width="320" height="360" fill="url(#s${i})"/><circle cx="${sun}" cy="90" r="43" fill="#ffefcd" opacity=".68"/><path d="M0 212 Q60 168 130 202 T320 195L320 360H0Z" fill="${c[2]}" opacity=".33"/><path d="M0 270 Q70 191 151 242 T320 227L320 360H0Z" fill="url(#m${i})"/><path d="M0 308Q84 261 158 300T320 284L320 360H0Z" fill="${c[3]}" opacity=".72"/><path d="M5 43 Q70 24 139 50" stroke="#fff" stroke-width="10" stroke-opacity=".1" fill="none"/></svg>`;}
function sampleAvatar(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ภาพสมาชิกสมมติ"><defs><linearGradient id="portraitGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfcce9"/><stop offset="1" stop-color="#8877ac"/></linearGradient></defs><rect width="320" height="360" fill="url(#portraitGradient)"/><circle cx="260" cy="74" r="79" fill="#ecd1e5" opacity=".45"/><path d="M21 360Q30 267 115 259H209Q300 266 320 360Z" fill="#302b52"/><path d="M126 249V283Q160 303 195 283V249" fill="#c68f75"/><ellipse cx="160" cy="165" rx="86" ry="110" fill="#2d273b"/><ellipse cx="160" cy="179" rx="63" ry="87" fill="#ddb093"/><path d="M93 155Q84 63 159 70Q237 73 225 155Q210 113 196 107Q160 145 93 155Z" fill="#2d273b"/><path d="M115 180h21M185 180h21" stroke="#47343c" stroke-width="4" stroke-linecap="round"/><path d="M147 214Q160 222 173 214" stroke="#a56b6a" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M128 272Q159 304 193 273" stroke="#eee4ea" stroke-opacity=".25" stroke-width="7" fill="none"/></svg>`;}
function navbar(){return `<nav class="bottomnav" aria-label="App navigation"><span class="item">${svg('compass')}<span>คนใกล้คุณ</span></span><span class="item">${svg('chat')}<span>แชท</span></span><span class="item">${svg('star')}<span>ความคิดเห็น</span></span><span class="item active">${svg('user')}<span>โปรไฟล์</span></span></nav>`;}
function header(){return `<header class="topbar"><button class="go-back" type="button" data-back>${svg('back',20)}<span>โปรไฟล์</span></button><div class="brand"><span class="logo">✦</span>ChatGun</div><span class="round-soft" aria-hidden="true">${svg('images',20)}</span></header>`;}
function uploadScreen(isPrivate){const label=isPrivate?'Private Gallery':'Gallery';return `${header()}<main class="page"><div class="breadcrumbs">โปรไฟล์ <span>›</span> ${label} <span>›</span> <b>เพิ่มรูป</b></div><div class="page-head"><div><div class="eyebrow">MY PHOTOS / UPLOAD</div><h2>${isPrivate?'เพิ่มรูปส่วนตัว':'เพิ่มรูปใน Gallery'}</h2><p class="page-intro">${isPrivate?'เก็บความทรงจำไว้สำหรับคนที่คุณอนุมัติ':'แชร์รูปภาพที่คุณอยากให้สมาชิกคนอื่นเห็น'}</p></div><span class="privacy-label ${isPrivate?'':'public'}">${svg(isPrivate?'lock':'eye',15)}${isPrivate?'Private':'Public'}</span></div><section class="upload-panel"><div class="dropzone ${isDragging?'drag':''}" id="dropzone"><div class="drop-icon">${svg('upload',26)}</div><strong>เพิ่มรูปภาพของคุณ</strong><p>เลือกได้หลายรูป · JPG, PNG หรือ WebP · ไม่เกิน 8 MB ต่อรูป</p><label class="upload-picker">${svg('plus',17)}เลือกรูปจากอุปกรณ์<input id="file-picker" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><div class="form-area">${photosSelected.length?`<div class="form-row"><span class="field-label">รูปที่เลือก (${photosSelected.length})</span><div class="thumb-strip">${photosSelected.map((x,i)=>`<div class="thumb-small"><img src="${x.url}" alt="รูปที่เลือก ${i+1}"><button class="remove" type="button" aria-label="ลบรูป ${i+1}" data-remove="${i}">×</button></div>`).join('')}</div></div>`:''}<div class="form-row"><label class="field-label" for="caption">คำบรรยาย <span style="color:#a296ae;font-weight:400">(ไม่บังคับ)</span></label><textarea id="caption" class="caption-field" maxlength="300" placeholder="เล่าเรื่องราวสั้น ๆ ของรูปนี้…"></textarea><p class="subtext">ไม่จำเป็นต้องกรอก หากต้องการอัปโหลดรูปอย่างรวดเร็ว</p></div><div class="privacy-note"><span class="note-icon">${svg(isPrivate?'lock':'eye',19)}</span><div><strong>${isPrivate?'บันทึกเป็นรูปส่วนตัว':'เผยแพร่ใน Gallery ปกติ'}</strong><span>${isPrivate?'มีเพียงคุณและสมาชิกที่คุณอนุมัติเท่านั้นที่เปิดดูได้ หลังผ่านการตรวจรูป':'สมาชิกที่มีสิทธิ์ใช้งานสามารถเห็นรูปได้ หลังผ่านการตรวจรูปโดยผู้ดูแล'}</span></div></div><div class="quota"><strong>อัปโหลดวันนี้</strong><span>4 / 10 รูป</span></div><div class="quota-track"><div class="quota-fill"></div></div><p class="quota-helper">Public และ Private ใช้โควตา Gallery เดียวกัน · เหลือ 6 รูปวันนี้ · สูงสุด 12 รูปรวมทั้งสองอัลบั้ม</p>${uploadMessage?`<p class="upload-status" role="status">${svg('check',18)} ${uploadMessage}</p>`:''}</div><footer class="action-bar"><button class="secondary" type="button" data-reset>ยกเลิก</button><button class="primary" type="button" data-submit>${svg('upload',17)} ${isPrivate?'บันทึกรูปส่วนตัว':'เพิ่มรูปใน Gallery'}${photosSelected.length?' ('+photosSelected.length+')':''}</button></footer></section><p class="upload-preview-note">UI prototype · การอัปโหลดเป็นการจำลองในเบราว์เซอร์เท่านั้น</p></main>${navbar()}`;}
function viewerHeader(isPrivate){return `<div class="breadcrumbs">โปรไฟล์ <span>›</span> <b>${isPrivate?'Private Gallery':'Gallery'}</b></div><div class="page-head"><div><div class="eyebrow">${isPrivate?'PRIVATE PHOTOS':'PUBLIC PHOTOS'}</div><h2>${isPrivate?'Private Gallery':'Gallery'}</h2><p class="page-intro">${isPrivate?'รูปที่เจ้าของอนุมัติให้คุณเข้าดู':'รูปภาพและความทรงจำของสมาชิก'}</p></div><span class="privacy-label ${isPrivate?'':'public'}">${svg(isPrivate?'unlock':'eye',15)}${isPrivate?'Private':'Public'}</span></div>`;}
function tiles(data){return `<div class="gallery-grid">${data.map((p,i)=>`<button type="button" class="tile" data-tile="${i}" aria-label="เปิดรูปที่ ${i+1} ${p.t}">${scene(p.p)}<span class="like-pill">${svg('heart',12)}${p.likes+(liked[p.id]?1:0)}</span></button>`).join('')}</div>`;}
function viewerScreen(isPrivate){if(isPrivate && perm!=='approved')return profileRequestScreen();const data=isPrivate?privatePhotos:publicPhotos;return `${header()}<main class="page">${viewerHeader(isPrivate)}<div class="viewer-head"><span class="avatar">${sampleAvatar()}</span><div class="viewer-copy"><strong>มะปราง</strong><p>${data.length} รูป · คาเฟ่, ศิลปะ, ถ่ายรูป</p></div><span class="scope-icon" aria-label="${isPrivate?'Approved private album':'Public gallery'}">${svg(isPrivate?'unlock':'images',20)}</span></div>${isPrivate?`<div class="private-summary">${svg('shield',19)}<div><strong>คุณได้รับสิทธิ์เข้าดูอัลบั้มนี้</strong><br><span>อนุมัติโดยเจ้าของอัลบั้ม · ไม่สามารถแชร์สิทธิ์ต่อได้</span></div></div>`:''}<div class="gallery-caption"><strong>${isPrivate?'รูปส่วนตัว':'รูปภาพทั้งหมด'}</strong><span>${data.length} รูป</span></div>${tiles(data)}<p class="viewer-hint">แตะรูปเพื่อเปิดเต็มจอ · กดถูกใจและแสดงความคิดเห็นได้</p></main>${navbar()}`;}
function profileRequestScreen(){return `${header()}<main class="page"><div class="breadcrumbs">คนใกล้คุณ <span>›</span> <b>โปรไฟล์</b></div><div class="profile-hero"><div class="hero-art">${sampleAvatar()}</div><div class="hero-shade"></div><div class="hero-details"><h2>มะปราง</h2><p>ชอบคาเฟ่ ศิลปะ และถ่ายภาพ</p><div class="profile-actions"><button type="button" class="profile-gallery-button" data-navigate="view-public">${svg('images',19)} Gallery</button><button type="button" class="private-icon-button" data-request-icon aria-label="${perm==='pending'?'รออนุมัติอัลบั้มส่วนตัว':'ขอดูอัลบั้มส่วนตัว'}" title="${perm==='pending'?'รออนุมัติ':'ขอสิทธิ์ดูอัลบั้มส่วนตัว'}">${lockIcon(false)}</button></div></div></div><p class="upload-preview-note">Locked / Pending state stays on Profile — Private Gallery is not opened before approval.</p></main>${navbar()}`;}
function render(){document.querySelectorAll('.mode').forEach(b=>{b.classList.toggle('on',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});document.querySelector('#demo-permission').classList.toggle('visible',mode==='view-private');document.querySelectorAll('.permission').forEach(b=>b.classList.toggle('selected',b.dataset.permission===perm));const isUpload=mode.startsWith('upload-');document.querySelector('#app').innerHTML=isUpload?uploadScreen(mode==='upload-private'):viewerScreen(mode==='view-private');if(isUpload)wireUpload();}
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
function setMode(next){mode=next;uploadMessage='';photosSelected.forEach(x=>URL.revokeObjectURL(x.url));photosSelected=[];render();}
document.querySelector('#mode-controls').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)});
document.querySelector('#demo-permission').addEventListener('click',e=>{const b=e.target.closest('[data-permission]');if(b){perm=b.dataset.permission;render()}});
function wireUpload(){const file=document.querySelector('#file-picker'),zone=document.querySelector('#dropzone');file.addEventListener('change',e=>chooseFiles(e.target.files));zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag')});zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');chooseFiles(e.dataTransfer.files)});}
function chooseFiles(files){for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){notify('รองรับ JPG, PNG, WebP ไม่เกิน 8 MB');continue}if(photosSelected.length>=6){notify('ตัวอย่างนี้เลือกได้สูงสุด 6 รูป');break}photosSelected.push({url:URL.createObjectURL(file),name:file.name})}render();}
function lightboxOpen(index){postIndex=index;const isPrivate=mode==='view-private';const data=isPrivate?privatePhotos:publicPhotos,p=data[index];if(!p)return;const comments=extraComments[p.id]||[];document.querySelector('#lightbox-inner').innerHTML=`<div class="lightbox-art">${scene(p.p)}</div><div class="lightbox-side"><div class="lightbox-top"><strong>มะปราง · ${isPrivate?'Private Gallery':'Gallery'}</strong><button class="lightbox-close" type="button" data-close aria-label="ปิด">×</button></div><p class="lightbox-caption">${p.t}</p><button class="lightbox-like ${liked[p.id]?'liked':''}" data-like="${p.id}">${svg('heart',18)} ${p.likes+(liked[p.id]?1:0)} Likes</button><div class="comment-group"><b>ความคิดเห็น</b><div class="comment"><strong>แพรวา</strong> ภาพสวยมากเลย!</div>${comments.map(c=>`<div class="comment"><strong>คุณ</strong> ${esc(c)}</div>`).join('')}</div><div class="comment-compose"><input id="comment" aria-label="แสดงความคิดเห็น" maxlength="300" placeholder="เขียนความคิดเห็น…"><button type="button" data-send aria-label="ส่งความคิดเห็น">${svg('arrow',19)}</button></div><div class="lightbox-arrows"><button type="button" data-prev ${index===0?'disabled':''}>← ก่อนหน้า</button><button type="button" data-next ${index>=data.length-1?'disabled':''}>ถัดไป →</button></div></div>`;document.querySelector('#lightbox').classList.add('open');document.querySelector('[data-close]')?.focus();}
function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.querySelector('#app').addEventListener('click',e=>{const nav=e.target.closest('[data-navigate]');if(nav){setMode(nav.dataset.navigate);return}const file=e.target.closest('[data-remove]');if(file){const index=+file.dataset.remove;const removed=photosSelected.splice(index,1)[0];if(removed)URL.revokeObjectURL(removed.url);render();return}if(e.target.closest('[data-submit]')){if(!photosSelected.length){notify('กรุณาเลือกรูปก่อนอัปโหลด');return}uploadMessage='เพิ่มรูปตัวอย่างแล้ว · รูปจะปรากฏหลังผู้ดูแลตรวจอนุมัติ';photosSelected.forEach(x=>URL.revokeObjectURL(x.url));photosSelected=[];render();return}if(e.target.closest('[data-reset]')){setMode(mode);return}const tile=e.target.closest('[data-tile]');if(tile){lightboxOpen(+tile.dataset.tile);return}if(e.target.closest('[data-request-icon]')){if(perm==='locked'){perm='pending';render();notify('ส่งคำขอแล้ว · เจ้าของจะได้รับใน Chat')}else notify('คำขอยังรอเจ้าของอนุมัติผ่าน Chat');return}if(e.target.closest('[data-back]')){if(mode.startsWith('upload'))notify('ตัวอย่าง: กลับไป Gallery ของคุณ');else notify('ตัวอย่าง: กลับไป Profile');}});
document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox'||e.target.closest('[data-close]')){document.querySelector('#lightbox').classList.remove('open');return}if(e.target.closest('[data-prev]')){lightboxOpen(postIndex-1);return}if(e.target.closest('[data-next]')){lightboxOpen(postIndex+1);return}const like=e.target.closest('[data-like]');if(like){liked[like.dataset.like]=!liked[like.dataset.like];lightboxOpen(postIndex);return}if(e.target.closest('[data-send]')){const value=document.querySelector('#comment')?.value.trim();if(!value){notify('กรุณาพิมพ์ความคิดเห็น');return}const p=(mode==='view-private'?privatePhotos:publicPhotos)[postIndex];(extraComments[p.id]||=[]).push(value);lightboxOpen(postIndex);notify('เพิ่มความคิดเห็นตัวอย่างแล้ว')}});
document.addEventListener('keydown',e=>{if(!document.querySelector('#lightbox').classList.contains('open'))return;if(e.key==='Escape')document.querySelector('#lightbox').classList.remove('open');if(e.key==='ArrowLeft')lightboxOpen(Math.max(0,postIndex-1));if(e.key==='ArrowRight')lightboxOpen(Math.min((mode==='view-private'?privatePhotos:publicPhotos).length-1,postIndex+1))});
render();
</script>
</body></html>
