<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชี ChatGun</title><link rel="stylesheet" href="./style.css"></head><body><main class="section"><img src="./logo.svg" alt="ChatGun" width="90"><h1>ยินดีต้อนรับสู่ ChatGun</h1><p id="status">กำลังตรวจสอบบัญชี...</p><button id="logout" class="button" hidden>ออกจากระบบ</button></main><script>fetch("/api/auth/me").then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById("status").textContent="เข้าสู่ระบบแล้ว "+(d.user.display_name||d.user.email||"สมาชิก ChatGun");document.getElementById("logout").hidden=false}).catch(()=>location.replace("./signup.html"));document.getElementById("logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});location.replace("./")}</script></body></html>
